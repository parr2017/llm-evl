<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>llm-evl · UI 重构原型</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.6/dist/index.css" />
<style>
/* ============================================================
   设计系统 — 扁平、低噪音、单一强调色
   ============================================================ */
:root{
  /* 表面：三层，从下到上 */
  --bg:        #0b0d10;
  --surface:   #12151a;
  --surface-2: #171b21;
  --surface-3: #1c2129;
  /* 线：一律 1px 发丝线 */
  --line:      #232830;
  --line-soft: #1a1e24;
  /* 文字：四级 */
  --fg:        #e6e9ee;
  --fg-2:      #98a2b3;
  --fg-3:      #667085;
  /* 强调色：只有一个 */
  --accent:      #5b8cff;
  --accent-dim:  rgba(91,140,255,.14);
  --accent-line: rgba(91,140,255,.32);
  /* 语义色：只用于状态，不做装饰 */
  --ok:   #3fb950;   --ok-dim:   rgba(63,185,80,.13);
  --warn: #d29922;   --warn-dim: rgba(210,153,34,.13);
  --err:  #f85149;   --err-dim:  rgba(248,81,73,.13);
  --info: #8b949e;

  --r:    6px;
  --r-sm: 4px;
  --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans: "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;

  /* Element Plus 扁平化覆盖 */
  --el-bg-color:#12151a; --el-bg-color-overlay:#171b21; --el-fill-color-blank:#0f1216;
  --el-fill-color-light:#1c2129; --el-fill-color-lighter:#171b21;
  --el-border-color:#2a303a; --el-border-color-light:#232830; --el-border-color-lighter:#1a1e24;
  --el-text-color-primary:#e6e9ee; --el-text-color-regular:#c3c9d2; --el-text-color-secondary:#98a2b3;
  --el-color-primary:#5b8cff; --el-border-radius-base:4px;
  --el-font-size-base:13px;
}
*{box-sizing:border-box}
html,body,#app{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.5;
     -webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a303a;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#39414d;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
[v-cloak]{display:none}
.ell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================ 布局 ============================ */
.shell{display:flex;height:100%}

/* --- 侧边栏：扁平，无品牌辉光 --- */
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);
      display:flex;flex-direction:column}
.side-hd{height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line)}
.side-logo{width:22px;height:22px;flex:0 0 22px;border-radius:var(--r-sm);background:var(--accent);
           color:#fff;font:700 12px/22px var(--sans);text-align:center}
.side-name{font-weight:600;font-size:13.5px;letter-spacing:-.1px}
.side-ver{font:500 10px/1 var(--mono);color:var(--fg-3);padding:2px 5px;border:1px solid var(--line);border-radius:3px}
.side-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-lbl{font:600 10px/1 var(--sans);letter-spacing:.9em;color:var(--fg-3);text-transform:uppercase;
         padding:14px 10px 7px}
.nav-lbl:first-child{padding-top:2px}
.nav-i{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:var(--r-sm);
       color:var(--fg-2);cursor:pointer;font-size:13px;user-select:none;transition:background .12s,color .12s}
.nav-i:hover{background:var(--surface-2);color:var(--fg)}
.nav-i.on{background:var(--accent-dim);color:#cddcff;font-weight:500}
.nav-i .ic{width:15px;text-align:center;font-size:13px;opacity:.85}
.nav-i .cnt{margin-left:auto;font:600 10px/1 var(--mono);color:var(--fg-3);
            background:var(--surface-3);padding:3px 5px;border-radius:3px}
.nav-i.on .cnt{background:rgba(91,140,255,.22);color:#cddcff}
.side-ft{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.side-ft .r{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg-3)}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.dot.ok{background:var(--ok)} .dot.run{background:var(--warn)} .dot.off{background:var(--fg-3)}

/* --- 主区 --- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 22px;
     border-bottom:1px solid var(--line);background:var(--surface)}
.bar h1{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.15px}
.bar .sub{font-size:12px;color:var(--fg-3)}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.scroll{flex:1;overflow-y:auto;padding:20px 22px 56px}
.wrap{max-width:1360px;margin:0 auto}

/* ============================ 基础件 ============================ */
/* 面板：只有一层背景 + 一根发丝线，没有阴影 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.panel-hd{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line-soft);min-height:42px}
.panel-hd h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.1px}
.panel-hd .note{font-size:11.5px;color:var(--fg-3)}
.panel-bd{padding:15px}
.panel-bd.tight{padding:0}

/* 按钮：扁平，实心/幽灵/文字 三种，禁用渐变 */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-sm);
     border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2);cursor:pointer;
     font:500 12.5px/1 var(--sans);white-space:nowrap;transition:all .12s}
.btn:hover{border-color:#39414d;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#4b7cf0;border-color:#4b7cf0}
.btn.gho{background:transparent}
.btn.dgr{color:var(--err)}
.btn.dgr:hover{border-color:rgba(248,81,73,.4);color:var(--err);background:var(--err-dim)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}

/* 标签：状态色，左侧小圆点 */
.tag{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:3px;
     font:600 11px/1 var(--sans);background:var(--surface-3);color:var(--fg-2)}
.tag.ok{background:var(--ok-dim);color:var(--ok)} .tag.warn{background:var(--warn-dim);color:var(--warn)}
.tag.err{background:var(--err-dim);color:var(--err)} .tag.acc{background:var(--accent-dim);color:#a8c0ff}
.tag i{width:5px;height:5px;border-radius:50%;background:currentColor}

/* 数值徽标 */
.chip{font:600 11px/1 var(--mono);padding:3px 6px;border-radius:3px;background:var(--surface-3);color:var(--fg-2)}
.chip.acc{background:var(--accent-dim);color:#a8c0ff} .chip.ok{background:var(--ok-dim);color:var(--ok)}
.chip.warn{background:var(--warn-dim);color:var(--warn)} .chip.err{background:var(--err-dim);color:var(--err)}

/* 表格：紧凑、自绘、粘性表头 */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--fg-3);
        font:600 11px/1 var(--sans);letter-spacing:.3px;text-align:left;padding:9px 12px;
        border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--fg-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.tbl .nm{color:var(--fg);font-weight:500}
.tbl tr.hi td{background:var(--accent-dim)}
.tbl tr.hi:hover td{background:rgba(91,140,255,.19)}
.tbl-wrap{max-height:340px;overflow:auto}
.best{color:var(--ok);font-weight:600} .worst{color:var(--err);font-weight:600}

/* 条形量表 */
.bar-l{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;min-width:56px}
.bar-l>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.bar-l.good>i{background:var(--ok)} .bar-l.mid>i{background:var(--warn)} .bar-l.bad>i{background:var(--err)}

/* 网格 */
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1180px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

/* 键值行 */
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;align-items:baseline}
.kvs dt{color:var(--fg-3)}
.kvs dd{margin:0;color:var(--fg);font-family:var(--mono);font-variant-numeric:tabular-nums}

.empty{padding:34px 16px;text-align:center;color:var(--fg-3);font-size:12.5px}
.div{height:1px;background:var(--line-soft);margin:12px 0}

/* ============================ 概览页 ============================ */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi .lb{font-size:11.5px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.kpi .vl{font:600 24px/1.2 var(--mono);letter-spacing:-.6px;margin-top:7px;font-variant-numeric:tabular-nums}
.kpi .vl .u{font-size:12px;color:var(--fg-3);font-weight:500;margin-left:3px;letter-spacing:0}
.kpi .ft{margin-top:6px;font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--fg-3)}
.d-up{color:var(--ok)} .d-dn{color:var(--err)} .d-eq{color:var(--fg-3)}

/* 结论条 */
.verdict{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);
         border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.verdict.good{border-left-color:var(--ok)} .verdict.bad{border-left-color:var(--err)}
.verdict .vh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.verdict .vh b{font-size:13px;font-weight:600}
.verdict p{margin:0;font-size:12.5px;color:var(--fg-2);line-height:1.65}
.verdict .vnums{margin-top:9px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
.verdict .vnums b{color:var(--fg);font-family:var(--mono);font-weight:600}

/* 覆盖度条 —— 直接回答"这次测了什么 / 没测什么" */
.cov{display:flex;gap:4px;margin-top:10px}
.cov .c{flex:1;height:26px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
        font:600 10.5px/1 var(--sans);border:1px solid var(--line);color:var(--fg-3);background:var(--surface-2)}
.cov .c.on{background:var(--ok-dim);border-color:rgba(63,185,80,.3);color:var(--ok)}
.cov .c.on.w{background:var(--warn-dim);border-color:rgba(210,153,34,.3);color:var(--warn)}
.cov .c.off{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,#14181d 4px,#14181d 8px)}

/* ============================ 报告页 ============================ */
/* 五维评分卡 */
.dim{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
     display:flex;flex-direction:column;gap:9px;min-height:132px}
.dim.na{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 5px,#14181d 5px,#14181d 10px)}
.dim .dh{display:flex;align-items:center;gap:7px}
.dim .dh b{font-size:12.5px;font-weight:600}
.dim .dv{margin-left:auto;font:600 19px/1 var(--mono);letter-spacing:-.5px}
.dim .dv .u{font-size:11px;color:var(--fg-3);font-weight:500}
.dim .dsub{font-size:11.5px;color:var(--fg-3);line-height:1.55}
.dim .dsub em{font-style:normal;color:var(--fg-2);font-family:var(--mono)}

/* Tab 条 */
.tabs{display:flex;gap:2px;padding:0 15px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 12px;font-size:12.5px;color:var(--fg-3);cursor:pointer;white-space:nowrap;
     border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.tab:hover{color:var(--fg-2)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}

/* 洞察行 */
.ins{display:flex;gap:9px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);
     border-left:2px solid var(--fg-3);font-size:12.5px;line-height:1.6;color:var(--fg-2)}
.ins.warn{border-left-color:var(--warn);background:var(--warn-dim)}
.ins.good{border-left-color:var(--ok);background:var(--ok-dim)}
.ins.info{border-left-color:var(--accent);background:var(--accent-dim)}
.ins b{color:var(--fg);font-weight:600}
.ins .ico{flex:0 0 auto;font-size:12px}

/* ============================ 对话页 ============================ */
.chat-w{height:calc(100vh - 268px);min-height:400px;display:flex;flex-direction:column}
.chat-sc{flex:1;overflow-y:auto;padding:14px 15px}
.msg-u{max-width:56%;margin-left:auto;padding:9px 12px;border-radius:var(--r) var(--r) 2px var(--r);
       background:var(--accent-dim);color:#cddcff;font-size:13px;line-height:1.6}
.mcols{display:grid;gap:12px;margin-top:12px}
.mcol{background:var(--surface-2);border:1px solid var(--line);border-top:2px solid var(--mc);
      border-radius:var(--r);padding:12px 13px;min-width:0}
.mcol .mh{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.mcol .mh b{font:600 12.5px/1 var(--sans);color:var(--mc)}
.mcol .mb{font-size:12.5px;line-height:1.7;color:var(--fg);white-space:pre-wrap;word-break:break-word;min-height:22px}
.mbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}
.mb2{font:600 10.5px/1 var(--mono);padding:3px 6px;border-radius:3px;background:var(--surface-3);color:var(--fg-2)}
.caret{display:inline-block;width:6px;height:13px;background:var(--accent);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.chat-in{display:flex;gap:8px;padding:11px 15px;border-top:1px solid var(--line);background:var(--surface)}

/* ============================ 其他 ============================ */
.frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:13px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label{font-size:11.5px;color:var(--fg-3);font-weight:500}
.fld .hint{font-size:10.5px;color:var(--fg-3);line-height:1.45}

.prov{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.prov-hd{display:flex;align-items:center;gap:10px;padding:10px 13px;flex-wrap:wrap}
.prov-hd .nm{font-weight:600;font-size:13px}
.prov-hd .url{font:400 11.5px/1 var(--mono);color:var(--fg-3)}

.prog{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.prog.stripe>i{background-image:linear-gradient(45deg,rgba(255,255,255,.16) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.16) 75%,transparent 75%);background-size:10px 10px}

.errgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.errb{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px}
.errb .lb{font-size:11px;color:var(--fg-3)}
.errb .vl{font:600 17px/1.2 var(--mono);margin-top:5px;letter-spacing:-.4px}

.cmp-pick{display:flex;align-items:center;gap:10px;padding:11px 15px;flex-wrap:wrap}
.reql{font:400 11.5px/1.7 var(--mono);color:var(--fg-2);max-height:230px;overflow:auto;
      background:#0f1216;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px}
.reql .t{color:var(--fg-3)} .reql .m{color:var(--accent)}

/* Element Plus 微调 */
.el-input__wrapper,.el-select__wrapper{background:var(--surface-2)!important;box-shadow:0 0 0 1px var(--line) inset!important;
  border-radius:var(--r-sm)!important;min-height:28px}
.el-input__wrapper:hover,.el-select__wrapper:hover{box-shadow:0 0 0 1px #39414d inset!important}
.el-input__inner{font-size:12.5px!important}
.el-select__placeholder,.el-input__inner{color:var(--fg-2)!important}
.el-input-number{width:100%}
.el-input-number .el-input__inner{text-align:left}
.el-button{border-radius:var(--r-sm)!important;font-size:12.5px!important}
.el-button--small{height:28px!important}
.el-switch{--el-switch-on-color:var(--accent);--el-switch-off-color:var(--surface-3)}
.el-radio-button__inner{background:var(--surface-2)!important;border-color:var(--line)!important;color:var(--fg-2)!important;
  font-size:12px!important;padding:7px 11px!important}
.el-radio-button__original-radio:checked+.el-radio-button__inner{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;box-shadow:none!important}
.el-tag{border-radius:3px!important}
.el-progress-bar__outer{background:var(--surface-3)!important}
.el-progress-bar__inner{background:var(--accent)!important}
.el-dialog{background:var(--surface)!important;border:1px solid var(--line);border-radius:var(--r)}
.el-dialog__title{font-size:13.5px!important;font-weight:600!important}
.el-tabs__item{font-size:12.5px!important;color:var(--fg-3)!important}
.el-tabs__item.is-active{color:var(--fg)!important}
.el-tabs__nav-wrap::after{background:var(--line)!important}
.el-form-item__label{font-size:12px!important;color:var(--fg-2)!important}

/* 顶部浮动说明 */
.proto{position:fixed;right:14px;bottom:14px;z-index:99;display:flex;gap:6px;align-items:center;
      background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
      font:500 11.5px/1 var(--sans);color:var(--fg-3);box-shadow:0 6px 22px -8px rgba(0,0,0,.7)}
.proto b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app" v-cloak>
<div class="shell">

  <!-- ================= 侧边栏 ================= -->
  <aside class="side">
    <div class="side-hd">
      <div class="side-logo">L</div>
      <div class="side-name">llm-evl</div>
      <div class="side-ver">0.2</div>
    </div>
    <nav class="side-nav">
      <div class="nav-lbl">测试</div>
      <div v-for="it in navA" :key="it.k" class="nav-i" :class="{on:page===it.k}" @click="go(it.k)">
        <span class="ic">{{it.i}}</span><span>{{it.l}}</span>
        <span v-if="it.c" class="cnt">{{it.c}}</span>
      </div>
      <div class="nav-lbl">分析</div>
      <div v-for="it in navB" :key="it.k" class="nav-i" :class="{on:page===it.k}" @click="go(it.k)">
        <span class="ic">{{it.i}}</span><span>{{it.l}}</span>
        <span v-if="it.c" class="cnt">{{it.c}}</span>
      </div>
      <div class="nav-lbl">配置</div>
      <div v-for="it in navC" :key="it.k" class="nav-i" :class="{on:page===it.k}" @click="go(it.k)">
        <span class="ic">{{it.i}}</span><span>{{it.l}}</span>
      </div>
    </nav>
    <div class="side-ft">
      <div class="r"><span class="dot ok"></span> 服务在线 · :7788</div>
      <div class="r"><span class="dot" :class="running?'run':'off'"></span> {{ running? '运行中 '+Math.round(prog*100)+'%' : '空闲' }}</div>
